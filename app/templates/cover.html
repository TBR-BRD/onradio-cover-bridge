<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Cover Display</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
      cursor: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }

    #cover {
      position: absolute;
      width: 100%;
      height: 100%;
      display: block;
      object-position: center center;
      object-fit: contain;
      background: #000;
      opacity: 1;
      transition: opacity 300ms linear;
    }

    #cover.fade {
      opacity: 0.18;
    }
  </style>
</head>
<body>
  <img id="cover" src="/static/kein-cover.png" alt="Album Cover">
  <script src="/static/cover-display.js?v=20260903b"></script>
</body>
</html>
